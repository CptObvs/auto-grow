; PlatformIO Projektkonfiguration
; Balkon-Bewässerungssystem mit ESP32
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serielle Übertragungsrate für Debugging
monitor_speed = 115200

; Bibliotheken
lib_deps =
    ; Für den integrierten Webserver (AsyncWebServer)
    me-no-dev/ESP Async WebServer @ ^1.2.3
    me-no-dev/AsyncTCP @ ^1.1.1

; Upload-Einstellungen
upload_speed = 921600

; Build-Flags
build_flags =
    -DCORE_DEBUG_LEVEL=0
