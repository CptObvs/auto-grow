; PlatformIO Projektkonfiguration
; Balkon-Bewässerungssystem mit ESP32
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serielle Übertragungsrate für Debugging
monitor_speed = 115200

; Bibliotheken
lib_deps =
    ; ESP-DASH — ESP32/ESP8266 Dashboard mit WebSocket-Echtzeit-Updates
    ; https://github.com/ayushsharma82/ESP-DASH
    ayushsharma82/ESP-DASH @ ^4.0.1
    ; Benötigt von ESP-DASH
    me-no-dev/ESP Async WebServer @ ^1.2.3
    me-no-dev/AsyncTCP @ ^1.1.1

; Upload-Einstellungen
upload_speed = 921600

; Build-Flags
build_flags =
    -DCORE_DEBUG_LEVEL=0
